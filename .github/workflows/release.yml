name: Release

# Manual release. Trigger it from the Actions tab (Run workflow) or with
#   gh workflow run release.yml -f tag=v0.1.0
# It builds the Tauri app for macOS (universal) and publishes a GitHub Release
# with the installers attached under the given tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (universal macOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: Augment ${{ inputs.tag }}
          releaseBody: |
            Augment desktop app for macOS (universal — Apple Silicon + Intel).

            This is an unsigned build: on first launch, right-click the app and
            choose **Open** to get past Gatekeeper.
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
