[package]
name = "augment"
version = "0.1.0"
description = "Augment — a personal Gmail augmentation desktop client"
authors = ["Isaac Lins"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique so it does not conflict with the
# bin name (a Windows-specific cargo quirk, harmless elsewhere).
name = "augment_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
dotenvy = "0.15"
thiserror = "2"
# Stores the OAuth refresh token in the OS-native secure store (macOS Keychain,
# Windows Credential Manager) so the session survives app restarts.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
